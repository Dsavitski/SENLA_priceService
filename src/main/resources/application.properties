spring.application.name=priceservice

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/priceservice}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

binance.api.url=${BINANCE_API_URL:https://api.binance.com/api/v3}
binance.poll.interval=${BINANCE_POLL_INTERVAL:PT30S}
binance.default.symbol=${BINANCE_DEFAULT_SYMBOL:BNBUSDT}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml